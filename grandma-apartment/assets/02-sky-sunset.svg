<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1040" width="1300" height="1040">
  <defs>
    <linearGradient id="sunsetSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B4A8B"/>
      <stop offset="50%" stop-color="#E58A7A"/>
      <stop offset="100%" stop-color="#F6C08A"/>
